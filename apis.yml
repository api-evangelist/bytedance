name: ByteDance
description: 'ByteDance is a global technology company founded in 2012 and headquartered
  in Beijing, operating across roughly 120 cities with more than 150,000 employees.
  It builds content, creativity, and productivity platforms powered by machine learning,
  including TikTok and Douyin (short-form video), Toutiao (news aggregation), CapCut
  (video editing), Lark/Feishu (enterprise collaboration), Pico (virtual reality),
  and the Volcano Engine cloud and AI platform. ByteDance maintains an active open
  source presence on GitHub with 400+ public repositories spanning AI agent frameworks,
  infrastructure, and media tooling. It was surfaced in the API Evangelist network
  as a portfolio company of altimeter-capital, coatue, ggv-capital, hongshan, idg-capital,
  softbank-vision-fund, and tiger-global.'
